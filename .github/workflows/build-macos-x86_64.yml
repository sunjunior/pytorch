name: Build PyTorch macOS x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13-xlarge
    timeout-minutes: 360
    env:
      BUILD_ENVIRONMENT: macos-x86_64
      MACOSX_DEPLOYMENT_TARGET: "11.1"
      CC: clang
      CXX: clang++
      MAX_JOBS: "4"
      BUILD_TEST: "0"
      WERROR: "0"
      # Features not suitable for Intel macOS / not needed for a CPU-only x86_64 wheel
      USE_CUDA: "0"
      USE_ROCM: "0"
      USE_XPU: "0"
      USE_MPS: "0"
      USE_VULKAN: "0"
      USE_NNPACK: "0"
      USE_QNNPACK: "0"
      USE_PYTORCH_QNNPACK: "0"
      USE_PYTORCH_METAL: "0"
      USE_MAGMA: "0"
      USE_OPENCL: "0"
      USE_NUMA: "0"
      USE_KINETO: "0"
      USE_FLASH_ATTENTION: "0"
      USE_MEM_EFF_ATTENTION: "0"
      USE_DISTRIBUTED: "0"
      USE_TENSORPIPE: "0"
      USE_GLOO: "0"
      USE_MPI: "0"
      USE_OPENMP: "0"
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build wheel
        run: python setup.py bdist_wheel --plat-name=macosx_10_9_x86_64

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: torch-macos-x86_64-wheel
          path: dist/*.whl
          retention-days: 30
